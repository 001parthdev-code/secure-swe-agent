name: Agent release validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-agent:
    name: Python agent (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agent/requirements-live.txt httpx2
      - name: Compile Python source
        run: python -m compileall -q agent
      - name: Run complete agent test suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GIT_TERMINAL_PROMPT: '0'
        run: python -m unittest discover -s agent/tests -p 'test_*.py' -v
