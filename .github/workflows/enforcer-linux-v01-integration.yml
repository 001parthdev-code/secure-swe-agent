name: Enforcer Linux V0.1 integrated functional gate
on:
  push:
  pull_request:
jobs:
  linux-v01-integrated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CLI from locked dependencies
        run: cargo build --locked -p enforcer-cli
      - name: Run controlled integrated functional test
        run: sudo -n python3 scripts/verify-linux-v01-integrated.py target/debug/enforcer-cli
