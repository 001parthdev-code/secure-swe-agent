name: Enforcer E3 Linux fixed execution
on:
  push:
  pull_request:
jobs:
  linux-e3-fixed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enforcer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Linux Enforcer CLI
        run: cargo build --locked -p enforcer-cli
      - name: Run restricted fixed-probe integration
        run: sudo -n python3 scripts/verify-linux-e3-fixed.py target/debug/enforcer-cli
